name: Oracle VPS Capacity Retry
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  try-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli
      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.oci/ssh_key.pub
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
      - name: Check if instance already exists
        id: check
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
        run: |
          OUTPUT=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --display-name "hermes-vps" \
            --lifecycle-state RUNNING \
            --query "length(data)" --raw-output 2>&1)
          echo "Raw check output: $OUTPUT"

          if [[ "$OUTPUT" =~ ^[0-9]+$ ]]; then
            COUNT="$OUTPUT"
          else
            echo "Check didn't return a clean number — treating as 0 so we don't get stuck skipping forever."
            COUNT="0"
          fi

          echo "Existing running instances named hermes-vps: $COUNT"
          echo "existing_count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Attempt instance launch
        if: steps.check.outputs.existing_count == '0'
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
        run: |
          set +e
          OUTPUT=$(oci compute instance launch \
            --availability-domain "${{ secrets.OCI_AD }}" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --assign-public-ip true \
            --display-name "hermes-vps" \
            --ssh-authorized-keys-file ~/.oci/ssh_key.pub 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -eq 0 ]; then
            echo ">>> SUCCESS: instance launched!"
            exit 0
          elif echo "$OUTPUT" | grep -q "Out of host capacity"; then
            echo ">>> No capacity this run — will retry next scheduled run. This is expected, not an error."
            exit 0
          else
            echo ">>> REAL ERROR — this is not a capacity issue, needs attention."
            exit 1
          fi
      - name: Skip notice
        if: steps.check.outputs.existing_count != '0'
        run: echo ">>> hermes-vps already running — skipping launch attempt this cycle."
